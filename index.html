<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caisse P1">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Caisse Padel One Échandens</title>
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface2:#f0f0f3; --line:rgba(0,0,0,.08);
  --text:#1d1d1f; --muted:#6e6e73; --gold:#b8902f; --gold2:#d9b25a; --goldSoft:rgba(184,144,47,.12);
  --ok:#1f9d55; --danger:#d93a3a; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --cash:#1f9d55; --card:#2f6fdb; --twint:#111;
  --r:16px; --qtext:#fff; --warn:#c77700; --warnSoft:rgba(230,150,0,.14); --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0b0b0c; --surface:#161618; --surface2:#1f1f22; --line:rgba(255,255,255,.08);
  --text:#f5f5f7; --muted:#9a9aa0; --gold:#d9b25a; --gold2:#f0d27e; --goldSoft:rgba(217,178,90,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --twint:#fff; --qtext:#111;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0b0b0c; --surface:#161618; --surface2:#1f1f22; --line:rgba(255,255,255,.08);
  --text:#f5f5f7; --muted:#9a9aa0; --gold:#d9b25a; --gold2:#f0d27e; --goldSoft:rgba(217,178,90,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --twint:#fff; --qtext:#111;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--text)}
.num{font-variant-numeric:tabular-nums}

/* Layout */
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand>div{min-width:0}
.brand img{width:38px;height:38px;border-radius:50%;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--gold);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.spacer{flex:1}
.clock{color:var(--muted);font-size:13px;white-space:nowrap}
.hbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);flex:none}
.hbtn:active{transform:scale(.95)}
.hbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{display:grid;grid-template-columns:1fr 380px;min-height:0}
.catalog{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:8px;padding:14px 18px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-weight:500;font-size:14px}
.tab.on{background:var(--text);color:var(--bg);border-color:transparent}
.grid{flex:1;overflow-y:auto;padding:10px 18px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;-webkit-overflow-scrolling:touch}
.sec{grid-column:1/-1;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 2px -2px}
.item{position:relative;background:var(--surface);border-radius:var(--r);padding:14px 14px 12px;min-height:96px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .08s}
.item:active{transform:scale(.96)}
.item .n{font-weight:600;font-size:14.5px;line-height:1.25;letter-spacing:-.01em}
.item .p{font-size:17px;font-weight:700;color:var(--gold);margin-top:8px}
.item .dot{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0}
.item .q{position:absolute;top:8px;right:8px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--gold);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.item .q{color:var(--qtext)}
.item.off{opacity:.35;pointer-events:none}
.item.free{border:1.5px dashed var(--line);box-shadow:none;background:transparent}

.hbtn{position:relative}
.badge[hidden]{display:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.item .st{position:absolute;right:10px;bottom:12px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.item .st.low{background:var(--warnSoft);color:var(--warn)} .item .st.out{background:rgba(217,58,58,.12);color:var(--danger)}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.ok{background:rgba(31,157,85,.12);color:var(--ok)} .pill.low{background:var(--warnSoft);color:var(--warn)} .pill.out{background:rgba(217,58,58,.12);color:var(--danger)}
.kpi.warn b{color:var(--warn)}
.stlist{display:flex;flex-direction:column}
.strow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.stn{min-width:0} .stn b{display:block;font-weight:600;font-size:14.5px} .stn small{color:var(--muted);font-size:12.5px}
.gauge{height:4px;border-radius:2px;background:var(--surface2);margin-top:7px;overflow:hidden;max-width:260px}
.gauge i{display:block;height:100%;border-radius:2px;background:var(--ok)} .gauge i.low{background:var(--warn)} .gauge i.out{background:var(--danger)}
.stact{grid-column:1/-1;display:flex;gap:6px}
.stact button{flex:1;height:36px;border-radius:10px;background:var(--surface2);font-size:13.5px;font-weight:600}
.stact button:active{background:var(--goldSoft)}
@media (min-width:821px){.strow{grid-template-columns:1fr auto auto}.stact{grid-column:auto}.stact button{flex:none;padding:0 12px}}
.artcard{padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.artcard .inp,.recrow .inp{height:44px;font-size:15px}
.artgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.artgrid label span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
@media (max-width:560px){.artgrid{grid-template-columns:repeat(2,1fr)}}
.recrow{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.recrow b{font-weight:600;font-size:14.5px}
.recrow .link{align-self:flex-start;padding-left:0}
.reccomp{display:grid;grid-template-columns:1fr 84px auto 32px;gap:6px;align-items:center}
.reccomp .u{font-size:13px;color:var(--muted);width:26px}
.tscroll{overflow-x:auto}
.tscroll table{min-width:520px}
/* Cart */
.cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-h{display:flex;align-items:center;padding:16px 18px 10px}
.cart-h h2{margin:0;font-size:18px;letter-spacing:-.02em}
.link{color:var(--muted);font-size:14px;padding:6px 4px}
.link.danger{color:var(--danger)}
.lines{flex:1;overflow-y:auto;padding:0 12px}
.empty{color:var(--muted);text-align:center;padding:48px 20px;font-size:14px}
.empty svg{width:40px;height:40px;stroke:var(--muted);fill:none;stroke-width:1.4;opacity:.5;display:block;margin:0 auto 10px}
.line{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line)}
.line .nm{flex:1;min-width:0}
.line .nm b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .nm small{color:var(--muted);font-size:12.5px}
.stp{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:10px}
.stp button{width:32px;height:32px;font-size:18px;font-weight:500;border-radius:10px}
.stp span{min-width:22px;text-align:center;font-weight:600}
.line .tt{width:64px;text-align:right;font-weight:600}
.totals{padding:14px 18px 6px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px;padding:2px 0}
.row.big{color:var(--text);font-size:28px;font-weight:700;letter-spacing:-.02em;padding:6px 0 2px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 18px calc(16px + var(--safe-b))}
.pbtn{height:64px;border-radius:14px;color:#fff;font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.pbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pbtn.cash{background:var(--cash)} .pbtn.card{background:var(--card)} .pbtn.twint{background:var(--twint);color:var(--bg)}
.pbtn:disabled{opacity:.3}
.pbtn:not(:disabled):active{transform:scale(.97)}
.lastsale{margin:0 18px 8px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

/* Mobile bar */
.mbar{display:none}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  .cart{position:fixed;inset:auto 0 0 0;height:88dvh;border-radius:22px 22px 0 0;border:0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:30}
  .cart.open{transform:none}
  .cart-h::before{content:"";position:absolute;left:50%;top:7px;width:38px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;padding:8px 14px calc(100px + var(--safe-b))}
  .tabs{padding:12px 14px 4px}
  .mbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));height:60px;border-radius:18px;background:var(--text);color:var(--bg);align-items:center;padding:0 18px;gap:12px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:600}
  .mbar.empty{transform:translateY(160%);pointer-events:none}
  .mbar{transition:transform .25s}
  .mbar .c{background:var(--gold);color:#111;border-radius:10px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px}
  .mbar .t{margin-left:auto;font-size:19px}
  .clock{display:none}
  .brand b{font-size:15px}
  header{padding-left:14px;padding-right:14px;gap:8px}
  .hbtn{width:36px;height:36px;border-radius:11px}
  .brand img{width:34px;height:34px}
  header .spacer{display:none}
  .brand small{letter-spacing:.08em}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:25}
.scrim.on{opacity:1;pointer-events:auto}

/* Modals */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.on{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border-radius:22px;width:100%;max-width:460px;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.sheet.wide{max-width:760px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.sh{display:flex;align-items:center;padding:18px 20px 6px}
.sh h3{margin:0;font-size:19px;letter-spacing:-.02em;flex:1}
.x{width:32px;height:32px;border-radius:50%;background:var(--surface2);font-size:18px;color:var(--muted)}
.sb{padding:8px 20px 20px}
.amount{text-align:center;padding:10px 0 16px}
.amount small{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.amount b{font-size:44px;letter-spacing:-.03em}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 14px;font-size:17px;outline:none;user-select:text;-webkit-user-select:text}
.inp:focus{border-color:var(--gold)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.quick button{height:46px;border-radius:12px;background:var(--surface2);font-weight:600}
.change{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;background:var(--goldSoft);margin:12px 0;font-weight:600}
.change b{font-size:24px;color:var(--gold)}
.change.neg{background:rgba(217,58,58,.1)} .change.neg b{color:var(--danger)}
.btn{width:100%;height:54px;border-radius:14px;font-weight:600;font-size:16px;background:var(--text);color:var(--bg);margin-top:8px}
a.btn{display:grid;place-items:center;text-decoration:none}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.35}
.btn.sm{height:42px;font-size:14px;width:auto;padding:0 16px;margin:0}
.qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:18px;margin:4px auto 12px;width:min(280px,100%);aspect-ratio:1}
.qr img{max-width:100%;max-height:100%;object-fit:contain}
.qr svg{width:100%;height:100%;display:block}
.qr svg rect[fill="#ffffff"]{fill:#fff}
.qr.none{background:var(--surface2);color:var(--muted);text-align:center;font-size:14px;padding:24px}
.note{font-size:13px;color:var(--muted);text-align:center;margin:6px 0}
.ok-anim{display:grid;place-items:center;padding:30px 0 10px}
.ok-anim div{width:84px;height:84px;border-radius:50%;background:var(--ok);display:grid;place-items:center;animation:pop .3s}
.ok-anim svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* PIN */
.pin-dots{display:flex;justify-content:center;gap:14px;margin:14px 0 22px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.f{background:var(--gold);border-color:var(--gold)}
.pin-dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto}
.pad button{height:62px;border-radius:50%;background:var(--surface2);font-size:24px;font-weight:500;aspect-ratio:1;justify-self:center;width:62px}
.pad button:active{background:var(--goldSoft)}

/* Report / settings */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 16px}
.kpi{background:var(--surface2);border-radius:14px;padding:12px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{font-size:19px;letter-spacing:-.02em}
.kpi.main{background:var(--goldSoft)} .kpi.main b{color:var(--gold)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
tr.cx td{color:var(--muted);text-decoration:line-through}
.h4{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 0 6px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface2)}
.tag.Cash{color:var(--cash)} .tag.Carte{color:var(--card)} .tag.TWINT{color:var(--text)}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bar-row .btn{flex:1;min-width:140px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.prow span{flex:1;font-size:14px}
.prow input[type=number]{width:84px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 8px;text-align:right;user-select:text;-webkit-user-select:text}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(18px)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Print */
#printArea{display:none}
@media print{
  body{overflow:visible;background:#fff;color:#000}
  .app,.modal,.toast,.scrim,.mbar{display:none!important}
  #printArea{display:block;font:12px/1.4 -apple-system,Helvetica,Arial,sans-serif;color:#000}
  #printArea table td,#printArea table th{border-bottom:1px solid #ddd;color:#000}
}
</style>
<style>html,body{height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>


<div class="app">

const CATS = [

const K = {cat:'p1e_catalog', sales:'p1e_sales', set:'p1e_settings', theme:'p1e_theme', stock:'p1e_stock', rec:'p1e_recipes', moves:'p1e_moves'};

const ls = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},

};
let catalog = mergeCatalog(ls.get(K.cat,null));
let sales = ls.get(K.sales,[]);
let settings = Object.assign({pin:'1234', twintQR:'', stripe:'', stripeQR:'', float:0, blockOut:false}, ls.get(K.set,{}));
let cart = [];            // {id,n,p,q}

function mergeCatalog(saved){
  if(!saved) return DEFAULT_CATALOG.map(x=>({...x,on:true}));
  const byId = Object.fromEntries(saved.map(x=>[x.id,x]));
  const base = DEFAULT_CATALOG.map(x=>byId[x.id]?{...x,p:byId[x.id].p,on:byId[x.id].on!==false}:{...x,on:true});
  return base;
}

/* ---------- Utils ---------- */
const $ = s=>document.querySelector(s);
const chf = c => (c/100).toFixed(2);
const CHF = c => 'CHF '+chf(c);
const vatOf = c => Math.round(c*VAT/(100+VAT));
const esc = s => String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dayKey = d => { d=new Date(d); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const hm = d => new Date(d).toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function haptic(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}

const icoSun='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const icoMoon='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function isDark(){const a=document.documentElement.dataset.theme;return a?a==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function applyTheme(t){
  if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme;
  $('#themeIco').innerHTML = isDark()?icoSun:icoMoon;
}

/* ---------- Horloge ---------- */
function tick(){$('#clock').textContent=new Date().toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short'})+' · '+new Date().toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,15000);

/* ---------- Catalogue ---------- */
function renderTabs(){
  $('#tabs').innerHTML = CATS.map(c=>`<button class="tab ${tab===c.id?'on':''}" onclick="setTab('${c.id}')">${c.n}</button>`).join('');
}
function setTab(t){tab=t;renderTabs();renderGrid();$('#grid').scrollTop=0}
function renderGrid(){
  const qty = Object.fromEntries(cart.map(l=>[l.id,l.q]));
  const cats = tab==='all'?CATS.slice(1):CATS.filter(c=>c.id===tab);
  let h='';
  cats.forEach(c=>{
    if(tab==='all') h+=`<div class="sec">${c.n}</div>`;
    catalog.filter(i=>i.c===c.id).forEach(i=>{
      const ist=itemStatus(i.id), blocked=settings.blockOut&&ist==='out';
      h+=`<button class="item ${i.on&&!blocked?'':'off'}" onclick="add('${i.id}')">
        <span class="dot" style="background:${c.col}"></span>
        ${qty[i.id]?`<span class="q">${qty[i.id]}</span>`:''}
        <span class="n">${esc(i.n)}</span><span class="p num">${chf(i.p)}</span>${ist==='low'||ist==='out'?`<span class="st ${ist}">${ist==='out'?'Épuisé':'Bas'}</span>`:''}</button>`;
    });
  });
  h+=`<div class="sec">Autre</div><button class="item free" onclick="freeAmount()"><span class="n">Montant libre</span><span class="p num" style="color:var(--muted)">+ CHF</span></button>`;
  $('#grid').innerHTML=h;
}
function add(id){
  const it=catalog.find(x=>x.id===id); if(!it) return;
  if(settings.blockOut&&itemStatus(id)==='out') return toast('Article épuisé');
  const l=cart.find(x=>x.id===id);
  l?l.q++:cart.push({id:it.id,n:it.n,p:it.p,q:1});
  haptic(); renderCart(); renderGrid();
}
function step(i,d){cart[i].q+=d; if(cart[i].q<=0) cart.splice(i,1); renderCart(); renderGrid()}
function clearCart(){cart=[];renderCart();renderGrid()}
const cartTotal = ()=>cart.reduce((s,l)=>s+l.p*l.q,0);
const cartCount = ()=>cart.reduce((s,l)=>s+l.q,0);
function renderCart(){
  const t=cartTotal(), n=cartCount();
  $('#lines').innerHTML = cart.length ? cart.map((l,i)=>`
    <div class="line"><div class="nm"><b>${esc(l.n)}</b><small class="num">${chf(l.p)}</small></div>
      <div class="stp"><button onclick="step(${i},-1)">−</button><span class="num">${l.q}</span><button onclick="step(${i},1)">+</button></div>
      <div class="tt num">${chf(l.p*l.q)}</div></div>`).join('')
    : `<div class="empty"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>Touchez un article pour l'ajouter</div>`;
  $('#tCount').textContent=n; $('#tVat').textContent=chf(vatOf(t)); $('#tTotal').textContent=CHF(t);
  $('#mCount').textContent=n; $('#mTotal').textContent=CHF(t); $('#mbar').classList.toggle('empty',!n);
  $('#clearBtn').style.visibility=cart.length?'visible':'hidden';
  document.querySelectorAll('.pbtn').forEach(b=>b.disabled=!t);
  $('#lastSale').innerHTML = lastSale && !cart.length ? `<span>Dernière vente ${hm(lastSale.ts)} · ${lastSale.m} · ${CHF(lastSale.total)}</span><button class="link danger" onclick="askCancel('${lastSale.id}')">Annuler</button>` : '';
}
function toggleCart(o){$('#cart').classList.toggle('open',o);$('#scrim').classList.toggle('on',o)}

/* ---------- Montant libre ---------- */
function freeAmount(){
  modal(`<div class="sh"><h3>Montant libre</h3><button class="x" onclick="closeModal()">×</button></div><div class="sb">
    <label class="field"><span>Libellé</span><input class="inp" id="fl" placeholder="Divers" maxlength="40"></label>
    <label class="field"><span>Montant TTC (CHF)</span><input class="inp num" id="fa" type="number" inputmode="decimal" step="0.05" min="0" placeholder="0.00"></label>
    <button class="btn gold" onclick="addFree()">Ajouter</button></div>`);
  setTimeout(()=>$('#fa').focus(),50);
}
function addFree(){
  const a=Math.round(parseFloat(($('#fa').value||'').replace(',','.'))*100);
  if(!a||a<=0) return toast('Montant invalide');
  cart.push({id:'free_'+Date.now(),n:($('#fl').value.trim()||'Divers'),p:a,q:1});
  closeModal(); renderCart(); renderGrid();
}

/* ---------- Modale ---------- */
function modal(html,wide){$('#sheet').className='sheet'+(wide?' wide':'');$('#sheet').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#sheet').innerHTML=''}

/* ---------- Paiement ---------- */
let payMethod=null;
function startPay(m){
  const t=cartTotal(); if(!t) return;
  payMethod=m;
  const head=`<div class="sh"><h3>Paiement ${m}</h3><button class="x" onclick="closeModal()">×</button></div><div class="sb">
    <div class="amount"><small>À encaisser</small><b class="num">${CHF(t)}</b><div class="note">dont TVA 8.1 % : CHF ${chf(vatOf(t))}</div></div>`;
  if(m==='Cash'){
    const notes=[...new Set([t, Math.ceil(t/500)*500, Math.ceil(t/1000)*1000, Math.ceil(t/2000)*2000, Math.ceil(t/5000)*5000, 10000])].filter(v=>v>=t).slice(0,4);
    modal(head+`<label class="field"><span>Montant reçu</span><input class="inp num" id="rcv" type="number" inputmode="decimal" step="0.05" placeholder="${chf(t)}" oninput="calcChange()"></label>
      <div class="quick">${notes.map(v=>`<button class="num" onclick="$('#rcv').value='${chf(v)}';calcChange()">${v===t?'Exact':chf(v)}</button>`).join('')}</div>
      <div class="change" id="chg"><span>Rendu</span><b class="num">CHF 0.00</b></div>
      <button class="btn gold" id="confirmBtn" onclick="confirmPay()">Confirmer le paiement</button></div>`);
  } else if(m==='Carte'){
    const qr=stripeQRHtml();
    modal(head+(settings.stripe||settings.stripeQR?`<div class="qr ${qr?'':'none'}">${qr||'QR indisponible hors connexion.<br>Utilisez le bouton ci-dessous.'}</div>
      <p class="note">Le client scanne le QR Stripe et saisit <b class="num">${CHF(t)}</b>, ou payez sur le terminal. Vérifiez la confirmation avant de valider.</p>
      ${settings.stripe?`<a class="btn ghost" href="${esc(settings.stripe)}" target="_blank" rel="noopener">Ouvrir le lien Stripe ↗</a>`:''}`
      :`<p class="note" style="margin-bottom:14px">Encaissez sur le terminal (SumUp / TPE), puis confirmez une fois le paiement accepté.<br>Ajoutez un lien Stripe dans Paramètres pour afficher un QR ici.</p>`)+
      `<button class="btn gold" onclick="confirmPay()">Paiement accepté — confirmer</button></div>`);
  } else {
    modal(head+`<div class="qr ${settings.twintQR?'':'none'}">${settings.twintQR?`<img src="${settings.twintQR}" alt="QR TWINT">`:'Aucun QR TWINT configuré.<br>Ajoutez-le dans Paramètres.'}</div>
      <p class="note">Le client scanne et saisit <b class="num">${CHF(t)}</b>. Vérifiez la confirmation sur son téléphone.</p>
      <button class="btn gold" onclick="confirmPay()">Paiement reçu — confirmer</button></div>`);
  }
}
function calcChange(){
  const t=cartTotal(), r=Math.round(parseFloat(($('#rcv').value||'').replace(',','.'))*100)||0;
  const d=r-t, el=$('#chg');
  if(!r){el.className='change';el.innerHTML='<span>Rendu</span><b class="num">CHF 0.00</b>';return}
  el.className='change'+(d<0?' neg':'');
  el.innerHTML = d<0?`<span>Manque</span><b class="num">${CHF(-d)}</b>`:`<span>Rendu</span><b class="num">${CHF(d)}</b>`;
}
function stripeQRHtml(){
  if(settings.stripeQR) return `<img src="${settings.stripeQR}" alt="QR Stripe">`;
  if(!settings.stripe||typeof qrcode!=='function') return '';
  try{const q=qrcode(0,'M');q.addData(settings.stripe);q.make();return q.createSvgTag({cellSize:6,margin:0,scalable:true})}catch(e){return ''}
}
function confirmPay(){
  const t=cartTotal(); if(!t) return;
  let received=null;
  if(payMethod==='Cash'){
    const v=$('#rcv').value; received = v?Math.round(parseFloat(v.replace(',','.'))*100):t;
    if(received<t) return toast('Montant reçu insuffisant');
  }
  const s={id:'V'+Date.now().toString(36).toUpperCase(), ts:Date.now(), m:payMethod, items:cart.map(l=>({id:l.id,n:l.n,p:l.p,q:l.q})), total:t, vat:vatOf(t), received, change:received!=null?received-t:null, cancelled:false};
  sales.push(s);
  if(!ls.set(K.sales,sales)){sales.pop();return}
  s.stk=applyStock(s.items,1); if(s.stk){ls.set(K.sales,sales);renderStockBadge()}
  lastSale=s; cart=[]; renderCart(); renderGrid(); toggleCart(false);
  modal(`<div class="sb"><div class="ok-anim"><div><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div></div>
    <div class="amount" style="padding-top:4px"><small>${s.m} · ${hm(s.ts)}</small><b class="num">${CHF(s.total)}</b>
    ${s.change?`<div class="change" style="margin-top:14px"><span>Rendu</span><b class="num">${CHF(s.change)}</b></div>`:''}</div>
    <button class="btn gold" onclick="closeModal()">Nouvelle vente</button></div>`);
  clearTimeout(window._okT); if(!s.change) window._okT=setTimeout(()=>{if($('.ok-anim'))closeModal()},1800);
}

/* ---------- PIN ---------- */
let pinBuf='', pinCb=null;
function guard(cb){pinCb=cb;pinBuf='';
  modal(`<div class="sh"><h3>Code administrateur</h3><button class="x" onclick="closeModal()">×</button></div><div class="sb">
    <div class="pin-dots" id="pd">${'<i></i>'.repeat(4)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="pinKey('${k}')">${k}</button>`).join('')}</div></div>`);
}
function pinKey(k){
  if(k==='⌫') pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<4) pinBuf+=k;
  document.querySelectorAll('#pd i').forEach((e,i)=>e.classList.toggle('f',i<pinBuf.length));
  if(pinBuf.length===4){
    if(pinBuf===String(settings.pin)){const cb=pinCb;pinCb=null;setTimeout(cb,120)}
    else{const d=$('#pd');d.classList.remove('err');void d.offsetWidth;d.classList.add('err');pinBuf='';setTimeout(()=>document.querySelectorAll('#pd i').forEach(e=>e.classList.remove('f')),300)}
  }
}
document.addEventListener('keydown',e=>{
  if($('#pd')&&/^[0-9]$/.test(e.key)) pinKey(e.key);
  else if($('#pd')&&e.key==='Backspace') pinKey('⌫');
  else if(e.key==='Escape') closeModal();
});

/* ---------- Historique & annulation ---------- */
function openHistory(){
  const today=sales.filter(s=>dayKey(s.ts)===dayKey(Date.now())).slice().reverse();
  modal(`<div class="sh"><h3>Ventes du jour</h3><button class="x" onclick="closeModal()">×</button></div><div class="sb">
    ${today.length?`<table><thead><tr><th>Heure</th><th>Détail</th><th>Mode</th><th class="r">CHF</th><th></th></tr></thead><tbody>
    ${today.map(s=>`<tr class="${s.cancelled?'cx':''}"><td class="num">${hm(s.ts)}</td>
      <td style="font-size:13px">${s.items.map(i=>`${i.q}× ${esc(i.n)}`).join(', ')}</td>
      <td><span class="tag ${s.m}">${s.m}</span></td><td class="r num">${chf(s.total)}</td>
      <td class="r">${s.cancelled?'<span class="tag">Annulée</span>':`<button class="link danger" onclick="askCancel('${s.id}')">Annuler</button>`}</td></tr>`).join('')}
    </tbody></table>`:'<div class="empty">Aucune vente aujourd\'hui</div>'}</div>`,true);
}
function askCancel(id){guard(()=>{
  const s=sales.find(x=>x.id===id); if(!s) return closeModal();
  modal(`<div class="sh"><h3>Annuler la vente ?</h3><button class="x" onclick="closeModal()">×</button></div><div class="sb">
    <div class="amount"><small>${s.m} · ${hm(s.ts)}</small><b class="num">${CHF(s.total)}</b></div>
    <p class="note">${s.items.map(i=>`${i.q}× ${esc(i.n)}`).join(' · ')}</p>
    <p class="note">${s.m==='Cash'?'Rendez le montant au client.':s.m==='Carte'?'Remboursez sur le terminal / Stripe.':'Remboursez via TWINT.'} La vente restera visible (barrée) dans le rapport et le stock sera recrédité.</p>
    <button class="btn danger" onclick="doCancel('${s.id}')">Confirmer l'annulation</button>
    <button class="btn ghost" onclick="closeModal()">Retour</button></div>`);
})}
function doCancel(id){
  const s=sales.find(x=>x.id===id); if(!s) return;
  s.cancelled=true; s.cancelledAt=Date.now();
  if(s.stk){applyStock(s.items,-1);s.stk=false;renderStockBadge();renderGrid()}
  ls.set(K.sales,sales);
  if(lastSale&&lastSale.id===id) lastSale=null;
  closeModal(); renderCart(); toast('Vente annulée');
}

/* ---------- Rapport ---------- */
let repDay=dayKey(Date.now());
function computeReport(day){
  const all=sales.filter(s=>dayKey(s.ts)===day);
  const ok=all.filter(s=>!s.cancelled), cx=all.filter(s=>s.cancelled);
  const by={Cash:0,Carte:0,TWINT:0}, cnt={Cash:0,Carte:0,TWINT:0};
  ok.forEach(s=>{by[s.m]+=s.total;cnt[s.m]++});
  const total=ok.reduce((a,s)=>a+s.total,0);
  const prod={};
  ok.forEach(s=>s.items.forEach(i=>{const k=i.n+'|'+i.p;(prod[k]=prod[k]||{n:i.n,p:i.p,q:0,t:0});prod[k].q+=i.q;prod[k].t+=i.p*i.q}));
  const prods=Object.values(prod).sort((a,b)=>b.t-a.t);
  const cons=consumptionFor(ok); let cogs=0, costed=false;
  Object.entries(cons).forEach(([sid,q])=>{const st=stById(sid); if(st&&st.cost){cogs+=q*st.cost;costed=true}});
  cogs=Math.round(cogs);
  return {cogs,costed,all,ok,cx,by,cnt,total,vat:vatOf(total),net:total-vatOf(total),prods,avg:ok.length?Math.round(total/ok.length):0,cxTotal:cx.reduce((a,s)=>a+s.total,0)};
}
function openReport(){
  const R=computeReport(repDay);
  const days=[...new Set(sales.map(s=>dayKey(s.ts)).concat(dayKey(Date.now())))].sort().reverse();
  const cashExp=(settings.float||0)+R.by.Cash;
  modal(`<div class="sh"><h3>Rapport de journée</h3><button class="x" onclick="closeModal()">×</button></div><div class="sb">
    <select class="inp" style="height:42px;font-size:15px" onchange="repDay=this.value;openReport()">${days.map(d=>`<option value="${d}" ${d===repDay?'selected':''}>${new Date(d+'T12:00').toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</option>`).join('')}</select>
    <div class="kpis" style="margin-top:14px">
      <div class="kpi main"><small>CA TTC</small><b class="num">${chf(R.total)}</b></div>
      <div class="kpi"><small>Ventes</small><b class="num">${R.ok.length}</b></div>
      <div class="kpi"><small>Ticket moyen</small><b class="num">${chf(R.avg)}</b></div>
      <div class="kpi"><small>Annulées</small><b class="num">${R.cx.length}</b></div>
    </div>
    <table><thead><tr><th>Mode</th><th class="r">Nb</th><th class="r">CHF</th></tr></thead><tbody>
      ${['Cash','Carte','TWINT'].map(m=>`<tr><td><span class="tag ${m}">${m}</span></td><td class="r num">${R.cnt[m]}</td><td class="r num">${chf(R.by[m])}</td></tr>`).join('')}
      <tr><td><b>Total TTC</b></td><td class="r num">${R.ok.length}</td><td class="r num"><b>${chf(R.total)}</b></td></tr>
      <tr><td style="color:var(--muted)">dont TVA 8.1 %</td><td></td><td class="r num" style="color:var(--muted)">${chf(R.vat)}</td></tr>
      <tr><td style="color:var(--muted)">CA HT</td><td></td><td class="r num" style="color:var(--muted)">${chf(R.net)}</td></tr>
    </tbody></table>
    <div class="h4">Caisse espèces</div>
    <table><tbody>
      <tr><td>Fond de caisse</td><td class="r num">${chf(settings.float||0)}</td></tr>
      <tr><td>+ Encaissé cash</td><td class="r num">${chf(R.by.Cash)}</td></tr>
      <tr><td><b>Attendu en caisse</b></td><td class="r num"><b>${chf(cashExp)}</b></td></tr>
      <tr><td>Compté</td><td class="r"><input class="inp num" id="counted" type="number" inputmode="decimal" step="0.05" style="height:38px;width:120px;text-align:right" oninput="diffCash(${cashExp})"></td></tr>
      <tr><td>Écart</td><td class="r num" id="ecart">—</td></tr>
    </tbody></table>
    ${R.costed?`<div class="h4">Marge (estimation)</div><table><tbody>
      <tr><td>CA HT</td><td class="r num">${chf(R.net)}</td></tr>
      <tr><td>Coût matière (selon coûts du stock)</td><td class="r num">−${chf(R.cogs)}</td></tr>
      <tr><td><b>Marge brute</b></td><td class="r num"><b>${chf(R.net-R.cogs)}</b> <span style="color:var(--muted)">(${R.net?Math.round((R.net-R.cogs)/R.net*100):0} %)</span></td></tr></tbody></table>`:''}
    ${alertCount()?`<div class="h4">Alertes stock</div><table><tbody>${stock.filter(x=>['low','out'].includes(stStatus(x))).map(x=>`<tr><td>${esc(x.n)}</td><td class="r num">${fmtQ(x.q,x.u)}</td><td class="r"><span class="pill ${stStatus(x)}">${ST_LBL[stStatus(x)]}</span></td></tr>`).join('')}</tbody></table>`:''}

  r.forEach(([sid])=>{const s=stById(sid); if(!s) return; const st=stStatus(s); if(st==='none') return; any=true;
    if(st==='out') worst='out'; else if(st==='low'&&worst!=='out') worst='low';});
  return any?worst:'none';

function applyStock(items, sign){

  items.forEach(i=>{(recipes[i.id]||[]).forEach(([sid,qty])=>{const s=stById(sid); if(s){s.q=r3(s.q-sign*qty*i.q); touched=true}})});

  return touched;
}

    body=`<p class="note" style="text-align:left;margin-top:0">Seuil = quantité à partir de laquelle l'article passe en « Stock bas ». Le coût d'achat par unité (HT ou TTC, restez cohérent) sert à calculer la valeur du stock et la marge.</p>
      ${stock.map(s=>`<div class="artcard">
        <input class="inp" value="${esc(s.n)}" onchange="stEdit('${s.id}','n',this.value)" aria-label="Nom">
        <div class="artgrid">
          <label><span>Unité</span><select class="inp" onchange="stEdit('${s.id}','u',this.value)"><option value="pce" ${s.u==='pce'?'selected':''}>Pièce</option><option value="L" ${s.u==='L'?'selected':''}>Litre</option></select></label>
          <label><span>Conditionnement</span><input class="inp" value="${esc(s.pk||'')}" placeholder="Carton" onchange="stEdit('${s.id}','pk',this.value)"></label>
          <label><span>Contenance (${s.u==='L'?'L':'pce'})</span><input class="inp num" type="number" inputmode="decimal" step="any" value="${s.ps||''}" onchange="stEdit('${s.id}','ps',this.value)"></label>
          <label><span>Seuil alerte</span><input class="inp num" type="number" inputmode="decimal" step="any" value="${s.min}" onchange="stEdit('${s.id}','min',this.value)"></label>
          <label><span>Coût / ${s.u==='L'?'L':'pce'} (CHF)</span><input class="inp num" type="number" inputmode="decimal" step="0.01" value="${s.cost?chf(s.cost):''}" placeholder="0.00" onchange="stEdit('${s.id}','cost',this.value)"></label>
          <label><span>&nbsp;</span><button class="btn ghost sm" style="width:100%;height:44px;color:var(--danger)" onclick="stDelete('${s.id}',this)">Supprimer</button></label>
        </div></div>`).join('')}
      <button class="btn" style="margin-top:14px" onclick="stAdd()">+ Nouvel article de stock</button>`;
  } else {
    body=`<p class="note" style="text-align:left;margin-top:0">Pour chaque article de la carte, indiquez ce qu'une vente retire du stock. Exemple : une pression 3dl retire 0,3 L du fût. Un article sans composant n'est pas suivi.</p>
      ${CATS.slice(1).map(c=>`<div class="h4">${c.n}</div>`+catalog.filter(i=>i.c===c.id).map(i=>`<div class="recrow"><b>${esc(i.n)}</b>
        ${(recipes[i.id]||[]).map(([sid,q],k)=>`<div class="reccomp"><select class="inp" onchange="recEdit('${i.id}',${k},'s',this.value)">${stock.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.n)}</option>`).join('')}</select>
          <input class="inp num" type="number" inputmode="decimal" step="any" value="${q}" onchange="recEdit('${i.id}',${k},'q',this.value)"><span class="u">${(stById(sid)||{}).u==='L'?'L':'pce'}</span>
          <button class="x" onclick="recEdit('${i.id}',${k},'del')" aria-label="Retirer">×</button></div>`).join('')}
        <button class="link" style="color:var(--gold)" onclick="recAdd('${i.id}')">+ composant</button></div>`).join('')).join('')}
      <button class="btn ghost" style="margin-top:16px" onclick="if(confirmTwice(this)){recipes=JSON.parse(JSON.stringify(DEFAULT_RECIPES));saveStock();openStock();renderGrid();toast('Recettes réinitialisées')}">Réinitialiser les recettes</button>`;
  }
  modal(`<div class="sh"><h3>Stock</h3><button class="x" onclick="closeModal()">×</button></div><div class="sb">${tabs}${body}</div>`,true);
}
function stockMove(sid,type){
  const s=stById(sid); if(!s) return;
  const T={in:['Entrée de marchandise','Quantité reçue','Enregistrer l\'entrée'],inv:['Comptage','Quantité réelle en stock','Mettre à jour le stock'],loss:['Perte / casse','Quantité perdue','Enregistrer la perte']}[type];
  const packs=s.ps>0&&s.pk&&type!=='inv';
  modal(`<div class="sh"><h3>${T[0]}</h3><button class="x" onclick="openStock()">‹</button></div><div class="sb">
    <div class="amount" style="padding-bottom:6px"><small>${esc(s.n)}</small><b class="num" style="font-size:30px">${s.init?fmtQ(s.q,s.u):'Non suivi'}</b></div>
    ${packs?`<div class="seg" style="margin:6px 0 4px"><button class="on" id="mvU1" onclick="mvUnit(1)">${esc(s.pk)} (${fmtQ(s.ps,s.u)})</button><button id="mvU0" onclick="mvUnit(0)">${s.u==='L'?'Litres':'Pièces'}</button></div>`:''}
    <label class="field"><span>${T[1]}${type==='inv'?` (${s.u==='L'?'litres':'pièces'})`:''}</span><input class="inp num" id="mvQ" type="number" inputmode="decimal" step="any" min="0" placeholder="0" oninput="mvPreview('${sid}','${type}')"></label>
    <label class="field"><span>Note (facultatif)</span><input class="inp" id="mvN" maxlength="60" placeholder="${type==='in'?'Fournisseur, n° de BL…':type==='loss'?'Casse, périmé, offert…':'Inventaire'}"></label>
    <div class="change" id="mvP"><span>Nouveau stock</span><b class="num">—</b></div>
    <button class="btn gold" onclick="mvSave('${sid}','${type}')">${T[2]}</button></div>`);
  window._mvPack=packs?1:0;
  setTimeout(()=>{const e=$('#mvQ');e&&e.focus()},50);
}
function mvUnit(p){window._mvPack=p;$('#mvU1').classList.toggle('on',!!p);$('#mvU0').classList.toggle('on',!p);const i=$('#mvQ');i&&i.dispatchEvent(new Event('input'))}
function mvCalc(sid,type){
  const s=stById(sid), v=parseFloat(($('#mvQ').value||'').replace(',','.'));
  if(!(v>=0)) return null;
  const q=type!=='inv'&&window._mvPack?v*s.ps:v;
  const base=s.init?s.q:0;
  const next=type==='in'?base+q:type==='loss'?base-q:q;
  return {q, next:r3(next), delta:r3(next-base)};
}
function mvPreview(sid,type){const s=stById(sid),c=mvCalc(sid,type),e=$('#mvP');e.querySelector('b').textContent=c?fmtQ(c.next,s.u):'—'}
function mvSave(sid,type){
  const s=stById(sid), c=mvCalc(sid,type);
  if(!c||(type!=='inv'&&!c.q)) return toast('Saisissez une quantité');
  s.q=c.next; s.init=true; logMove(sid,type,c.delta,$('#mvN').value.trim()); saveStock();
  renderGrid(); renderStockBadge(); toast(type==='in'?'Entrée enregistrée':type==='loss'?'Perte enregistrée':'Stock mis à jour'); openStock();
}
function fullInventory(){
  modal(`<div class="sh"><h3>Inventaire complet</h3><button class="x" onclick="openStock()">‹</button></div><div class="sb">
    <p class="note" style="text-align:left;margin-top:0">Saisissez la quantité comptée. Laissez vide pour ne pas modifier un article.</p>
    ${stock.map(s=>`<div class="prow"><span>${esc(s.n)}<br><small style="color:var(--muted)" class="num">actuel : ${s.init?fmtQ(s.q,s.u):'non suivi'}</small></span>
      <input type="number" inputmode="decimal" step="any" min="0" data-sid="${s.id}" class="invq" placeholder="${s.u==='L'?'L':'pce'}"></div>`).join('')}
    <button class="btn gold" style="margin-top:14px" onclick="saveInventory()">Valider l'inventaire</button></div>`,true);
}
function saveInventory(){
  let n=0;
  document.querySelectorAll('.invq').forEach(inp=>{const v=parseFloat((inp.value||'').replace(',','.')); if(!(v>=0)) return;
    const s=stById(inp.dataset.sid); const d=r3(v-(s.init?s.q:0)); s.q=r3(v); s.init=true; logMove(s.id,'inv',d,'Inventaire complet'); n++;});
  if(!n) return toast('Aucune quantité saisie');
  saveStock(); renderGrid(); renderStockBadge(); toast(`${n} article${n>1?'s':''} mis à jour`); stTab='etat'; openStock();
}
function stEdit(id,f,v){const s=stById(id); if(!s) return;
  if(f==='n'){s.n=v.trim()||s.n} else if(f==='u'||f==='pk'){s[f]=v.trim()} else if(f==='cost'){s.cost=Math.round((parseFloat(String(v).replace(',','.'))||0)*100)} else {s[f]=Math.max(0,parseFloat(String(v).replace(',','.'))||0)}
  saveStock(); renderStockBadge(); renderGrid(); if(f==='u') openStock();}
function stAdd(){const id='st_u'+Date.now().toString(36); stock.push({id,n:'Nouvel article',u:'pce',pk:'Carton',ps:24,min:5,q:0,cost:0,init:false}); saveStock(); openStock();
  setTimeout(()=>{const c=document.querySelectorAll('.artcard');const l=c[c.length-1];if(l){l.scrollIntoView({block:'center'});l.querySelector('input').select()}},60)}
function stDelete(id,btn){if(!confirmTwice(btn))return; stock=stock.filter(s=>s.id!==id);
  Object.keys(recipes).forEach(k=>{recipes[k]=recipes[k].filter(([sid])=>sid!==id)}); saveStock(); renderGrid(); renderStockBadge(); openStock(); toast('Article supprimé')}
function recEdit(iid,k,f,v){const r=recipes[iid]; if(!r) return;
  if(f==='del') r.splice(k,1); else if(f==='s') r[k][0]=v; else r[k][1]=Math.max(0,parseFloat(String(v).replace(',','.'))||0);
  saveStock(); renderGrid(); if(f!=='q') openStock();}
function recAdd(iid){(recipes[iid]=recipes[iid]||[]).push([stock[0]?stock[0].id:'',1]); saveStock(); openStock()}
function exportStock(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['Padel One Échandens — Stock au '+new Date().toLocaleString('fr-CH')],[],['Article','Unité','Quantité','Seuil','Statut','Conditionnement','Contenance','Coût unitaire CHF','Valeur CHF']];
  stock.forEach(s=>rows.push([s.n,s.u,s.init?String(r3(s.q)).replace('.',','):'',String(s.min).replace('.',','),ST_LBL[stStatus(s)],s.pk||'',String(s.ps||'').replace('.',','),s.cost?chf(s.cost):'',s.init&&s.cost&&s.q>0?chf(Math.round(s.q*s.cost)):'']));
  rows.push([],['Mouvements'],['Date','Heure','Article','Type','Quantité','Note']);
  moves.forEach(m=>{const s=stById(m.sid);rows.push([dayKey(m.ts),hm(m.ts),s?s.n:m.sid,m.type,String(m.d).replace('.',','),m.note])});
  download(`PadelOne-Echandens_stock_${dayKey(Date.now())}.csv`,'﻿'+rows.map(r=>r.map(q).join(';')).join('\n'));
}

/* ---------- Init ---------- */
renderTabs(); renderGrid(); renderCart(); renderStockBadge();
</script>
